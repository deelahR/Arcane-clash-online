<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arcane Clash Seal Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #100f0d;
      --panel: #1b1712;
      --panel-2: #241b15;
      --line: #4f4234;
      --text: #fff7e6;
      --muted: #d8c59e;
      --hot: #ff6a2a;
      --frost: #79d7ff;
      --storm: #ffd25f;
      --earth: #88d071;
      --void: #c68cff;
      --bad: #ff3b4f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2a1d16 0, var(--bg) 46rem);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 14px;
    }

    button, input, select {
      font: inherit;
    }

    .app {
      width: min(660px, 100%);
      background: color-mix(in srgb, var(--panel) 96%, black);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.18rem, 4vw, 1.55rem);
      line-height: 1.1;
    }

    .sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 4px 0 0;
    }

    .btn {
      border: 1px solid #75644e;
      background: #15120e;
      color: var(--text);
      border-radius: 8px;
      min-height: 42px;
      padding: 0 14px;
      cursor: pointer;
    }

    .btn.primary {
      background: #ff6a2a;
      border-color: #ffc15f;
      color: #1a0d06;
      font-weight: 800;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .lobby, .game {
      display: none;
    }

    .scene-on {
      display: block;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .lobby-grid {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .lobby-section {
      border: 1px solid var(--line);
      background: #12100d;
      border-radius: 8px;
      padding: 12px;
    }

    .lobby-section h2 {
      margin: 0 0 8px;
      font-size: 0.98rem;
      line-height: 1.15;
    }

    .lobby-section .row {
      margin-top: 8px;
    }

    .big-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .choice-card {
      border: 1px solid #5b4b39;
      background: #17130f;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .choice-card b {
      font-size: 0.94rem;
    }

    .choice-card .btn {
      width: 100%;
    }

    .choice-card select {
      width: 100%;
    }

    .guide-toggle {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      margin-top: 8px;
    }

    .spell-guide[open] .guide-toggle {
      margin-bottom: 10px;
    }

    input, select {
      flex: 1 1 150px;
      min-width: 0;
      background: #12100d;
      color: var(--text);
      border: 1px solid #5b4b39;
      border-radius: 8px;
      min-height: 42px;
      padding: 0 12px;
    }

    input {
      text-transform: uppercase;
    }

    .note {
      border: 1px solid var(--line);
      background: #12100d;
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.35;
      margin-top: 10px;
    }

    .rooms {
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .room-card {
      border: 1px solid var(--line);
      background: #12100d;
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
    }

    .room-card b {
      display: block;
      font-size: 1rem;
    }

    .room-card span {
      color: var(--muted);
      font-size: 0.84rem;
      display: block;
      margin-top: 2px;
    }

    .room-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .room-actions .btn {
      min-height: 34px;
      padding: 0 10px;
      font-size: 0.84rem;
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 6px 0;
    }

    .fighter {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      background: #12100d;
    }

    .fighter b {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      line-height: 1.1;
      margin-bottom: 5px;
      min-width: 0;
    }

    .fighter b span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar {
      height: 7px;
      border-radius: 999px;
      background: #352820;
      overflow: hidden;
      border: 1px solid #4d3b2f;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #73d17c, #ffd25f, #ff5f45);
      transition: width 220ms ease;
    }

    .round-panel {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 8px;
      align-items: stretch;
      margin: 8px 0;
    }

    .round-panel .note,
    .round-panel .timer,
    .round-panel .result {
      margin: 0;
    }

    .round-panel .note {
      min-height: 0;
      display: flex;
      align-items: center;
    }

    .round-main {
      display: grid;
      gap: 8px;
    }

    .timer {
      border: 1px solid var(--line);
      background: #12100d;
      border-radius: 8px;
      padding: 7px 9px;
      margin: 8px 0;
      display: grid;
      gap: 5px;
    }

    .timer-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .timer-count {
      color: #ffd166;
      font-variant-numeric: tabular-nums;
    }

    .timer-track {
      height: 7px;
      border-radius: 999px;
      background: #352820;
      border: 1px solid #4d3b2f;
      overflow: hidden;
    }

    .timer-fill {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff6a2a, #ffd166);
      box-shadow: 0 0 16px rgba(255, 106, 42, 0.65);
      transition: width 90ms linear;
    }

    .seal {
      position: relative;
      width: min(92vw, 520px);
      aspect-ratio: 1;
      margin: 8px auto 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at center, rgba(255, 106, 42, 0.12), transparent 42%),
        #15120f;
      touch-action: none;
      user-select: none;
      overflow: hidden;
    }

    .seal.phase-hidden {
      display: none;
    }

    .seal-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .ring {
      fill: none;
      stroke: rgba(121, 215, 255, 0.42);
      stroke-width: 2;
      stroke-dasharray: 8 9;
    }

    .ring.inner {
      stroke: rgba(255, 210, 95, 0.36);
      stroke-dasharray: 5 8;
    }

    .draw-line {
      stroke: var(--hot);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 12px currentColor);
    }

    .draw-line.live {
      opacity: 0.72;
      stroke-width: 9;
    }

    .draw-line.fail {
      stroke: var(--bad);
      animation: failPulse 420ms ease both;
    }

    .draw-line.success {
      animation: castPulse 560ms ease both;
    }

    @keyframes castPulse {
      0% { stroke-width: 10; opacity: 0.72; }
      50% { stroke-width: 18; opacity: 1; }
      100% { stroke-width: 14; opacity: 1; }
    }

    @keyframes failPulse {
      0%, 100% { opacity: 1; transform: translateX(0); }
      25% { transform: translateX(-3px); }
      50% { opacity: 0.5; transform: translateX(3px); }
      75% { transform: translateX(-2px); }
    }

    .dot {
      position: absolute;
      width: 54px;
      height: 54px;
      margin: -27px 0 0 -27px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 2px solid #8c7c62;
      background: #242019;
      color: #dbcba5;
      font-weight: 850;
      font-size: 1rem;
      z-index: 2;
      transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .dot.hit {
      color: #160c06;
      background: var(--hot);
      border-color: #ffd166;
      box-shadow: 0 0 20px currentColor;
    }

    .dot.center-zone {
      border-color: rgba(255, 210, 95, 0.7);
    }

    .dot.ring-zone {
      border-color: rgba(121, 215, 255, 0.72);
    }

    .result {
      margin-top: 8px;
      border: 1px solid var(--line);
      background: #12100d;
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 58px;
    }

    .pattern {
      color: var(--muted);
      font-size: 0.76rem;
      overflow-wrap: anywhere;
    }

    .cast {
      margin-top: 4px;
      font-weight: 950;
      font-size: clamp(0.98rem, 3.4vw, 1.22rem);
      color: #ffd166;
      text-shadow: 0 0 13px rgba(255, 106, 42, 0.85);
    }

    .battle-reveal {
      display: none;
      width: min(92vw, 520px);
      margin: 8px auto 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at center, rgba(255, 209, 102, 0.16), transparent 34%),
        #15120f;
      padding: 14px;
      overflow: hidden;
    }

    .battle-reveal.phase-on {
      display: block;
      animation: revealIn 420ms cubic-bezier(0.2, 0.85, 0.2, 1.12) both;
    }

    .pve-choice-panel {
      display: none;
      width: min(92vw, 520px);
      margin: 8px auto 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #12100d;
      padding: 10px;
    }

    .pve-choice-panel.phase-on {
      display: block;
    }

    .pve-spell-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .pve-spell-btn {
      border: 1px solid #5b4b39;
      border-radius: 8px;
      background: #17130f;
      color: var(--text);
      padding: 7px;
      cursor: pointer;
      display: grid;
      gap: 5px;
      place-items: center;
      text-align: center;
    }

    .pve-spell-btn img {
      width: min(18vw, 62px);
      aspect-ratio: 1;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #806c50;
    }

    .pve-spell-btn b {
      font-size: 0.78rem;
    }

    .pve-spell-btn:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .versus {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }

    .combatant {
      display: grid;
      gap: 7px;
      text-align: center;
      min-width: 0;
    }

    .combatant img,
    .spell-placeholder {
      width: min(34vw, 150px);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 50%;
      border: 1px solid #806c50;
      background: #100f0d;
      box-shadow: 0 0 24px rgba(255, 209, 102, 0.22);
      object-fit: cover;
    }

    .spell-placeholder {
      display: grid;
      place-items: center;
      color: #ffd166;
      font-weight: 950;
      font-size: 0.86rem;
    }

    .combatant b {
      font-size: 0.82rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .combatant span {
      color: var(--muted);
      font-size: 0.76rem;
    }

    .vs-mark {
      color: #ffd166;
      font-weight: 950;
      font-size: clamp(1.3rem, 5vw, 2rem);
      text-shadow: 0 0 16px rgba(255, 106, 42, 0.8);
      animation: vsFlash 900ms ease both;
    }

    .combatant.win img,
    .combatant.win .spell-placeholder {
      animation: winnerStrike 1100ms cubic-bezier(0.2, 0.85, 0.2, 1.05) both;
    }

    .combatant.lose img,
    .combatant.lose .spell-placeholder {
      animation: loserHit 1050ms ease both;
    }

    .combatant.draw img,
    .combatant.draw .spell-placeholder {
      animation: drawPulse 980ms ease both;
    }

    @keyframes revealIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes winnerStrike {
      0% { transform: scale(0.84) translateY(10px); filter: brightness(0.75) saturate(0.9); }
      28% { transform: scale(1.2) translateY(-8px); filter: brightness(1.55) saturate(1.35); }
      58% { transform: scale(1.04) translateY(0); filter: brightness(1.15) saturate(1.1); }
      100% { transform: scale(1.1); filter: brightness(1.28) saturate(1.22); box-shadow: 0 0 42px rgba(255, 209, 102, 0.56); }
    }

    @keyframes loserHit {
      0% { transform: translateX(0) scale(1); opacity: 1; filter: brightness(1); }
      18% { transform: translateX(-12px) rotate(-4deg) scale(0.9); opacity: 0.45; filter: brightness(1.5); }
      36% { transform: translateX(10px) rotate(3deg) scale(0.86); opacity: 0.62; filter: brightness(0.8); }
      58% { transform: translateX(-7px) rotate(-2deg) scale(0.82); opacity: 0.38; }
      100% { transform: translateX(0) scale(0.78); opacity: 0.34; filter: grayscale(0.45) brightness(0.65); }
    }

    @keyframes drawPulse {
      0% { transform: scale(0.88); opacity: 0.62; filter: brightness(0.8); }
      35% { transform: scale(1.12); opacity: 1; filter: brightness(1.28); }
      70% { transform: scale(0.96); opacity: 0.72; filter: brightness(0.95); }
      100% { transform: scale(1); opacity: 0.86; }
    }

    @keyframes vsFlash {
      0% { transform: scale(0.7); opacity: 0; }
      35% { transform: scale(1.26); opacity: 1; }
      100% { transform: scale(1); opacity: 0.92; }
    }

    .guide-layout {
      display: grid;
      grid-template-columns: minmax(230px, 0.74fr) minmax(300px, 1.26fr);
      gap: 16px;
      align-items: center;
      margin-top: 12px;
    }

    .guide-side {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .guide-rules {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .guide-rule {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #12100d;
      padding: 8px;
      min-width: 0;
    }

    .guide-rule b,
    .guide-rule span {
      display: block;
    }

    .guide-rule b {
      color: #ffd166;
      font-size: 0.86rem;
      line-height: 1.05;
    }

    .guide-rule span {
      color: var(--muted);
      font-size: 0.68rem;
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    .spell-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .spell-cycle {
      position: relative;
      width: 100%;
      max-width: 310px;
      aspect-ratio: 1;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 50%;
      background:
        radial-gradient(circle at center, rgba(255, 209, 102, 0.11), transparent 31%),
        #12100d;
    }

    .cycle-core {
      position: absolute;
      inset: 36%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid #725f45;
      color: #ffd166;
      font-size: 0.7rem;
      font-weight: 900;
      text-align: center;
      padding: 8px;
    }

    .cycle-arrow {
      position: absolute;
      inset: 7%;
      border-radius: 50%;
      border: 1px dashed rgba(255, 209, 102, 0.34);
    }

    .cycle-links {
      position: absolute;
      inset: 12%;
      width: 76%;
      height: 76%;
      overflow: visible;
      pointer-events: none;
    }

    .cycle-links path {
      fill: none;
      stroke: rgba(255, 209, 102, 0.46);
      stroke-width: 2.1;
      stroke-linecap: round;
      filter: drop-shadow(0 0 4px rgba(255, 145, 47, 0.28));
    }

    .cycle-node {
      position: absolute;
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 209, 102, 0.58);
      border-radius: 50%;
      background: #17130f;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.42);
    }

    .cycle-node img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cycle-node b {
      position: absolute;
      left: 50%;
      bottom: -24px;
      transform: translateX(-50%);
      font-size: 0.68rem;
      color: #f7e5b2;
      white-space: nowrap;
      text-shadow: 0 2px 8px #000;
    }

    .cycle-node span { display: none; }

    .cycle-flame { left: 50%; top: 6%; }
    .cycle-frost { left: 86%; top: 28%; }
    .cycle-water { left: 86%; top: 72%; }
    .cycle-lightning { left: 50%; top: 94%; }
    .cycle-storm { left: 14%; top: 72%; }
    .cycle-earth { left: 14%; top: 28%; }

    .spell {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #12100d;
      overflow: hidden;
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      align-items: stretch;
    }

    .spell img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 68px;
      object-fit: cover;
      object-position: center;
      border-right: 1px solid var(--line);
    }

    .spell b,
    .spell span {
      display: block;
      padding: 0 7px;
    }

    .spell b {
      padding-top: 6px;
      font-size: 0.84rem;
    }

    .spell span {
      color: var(--muted);
      font-size: 0.68rem;
      padding-bottom: 3px;
      overflow-wrap: anywhere;
    }

    .spell .spell-win {
      color: #ffd166;
      padding-bottom: 7px;
    }

    .match-over .seal {
      opacity: 0.58;
      pointer-events: none;
    }

    .practice-on .hud,
    .practice-on .timer,
    .practice-on .battle-reveal,
    .practice-on .pve-choice-panel {
      display: none;
    }

    .pve-card-on .seal {
      display: none;
    }

    .practice-on .round-panel {
      grid-template-columns: 1fr;
    }

    @media (max-width: 560px) {
      body { padding: 8px; }
      .app { padding: 10px; }
      .top {
        align-items: flex-start;
      }
      .top .row {
        margin-top: 0;
        justify-content: flex-end;
      }
      .hud { grid-template-columns: 1fr 1fr; }
      .big-actions { grid-template-columns: 1fr; }
      .round-panel { grid-template-columns: 1fr; }
      .battle-reveal { padding: 10px; }
      .versus { gap: 6px; }
      .combatant img,
      .spell-placeholder { width: min(35vw, 122px); }
      .pve-spell-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dot {
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
      }
      .draw-line { stroke-width: 11; }
      .guide-layout { grid-template-columns: 1fr; }
      .guide-rules { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .spell-list { grid-template-columns: 1fr; }
      .cycle-node {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="lobby" class="lobby scene-on">
      <div class="top">
        <div>
          <h1>Arcane Clash</h1>
          <p class="sub">Magic spell duel</p>
        </div>
      </div>
      <div class="lobby-grid">
        <section class="lobby-section">
          <h2>Your Name</h2>
          <input id="playerNameInput" maxlength="18" value="Mage" aria-label="Player name" />
        </section>

        <div class="big-actions">
          <section class="choice-card">
            <b>Practice</b>
            <select id="practiceSpellSelect" aria-label="Practice spell"></select>
            <button class="btn primary" id="practiceBtn">Practice Drawing</button>
          </section>

          <section class="choice-card">
            <b>Online Duel</b>
            <input id="roomInput" maxlength="8" value="ARCANE" aria-label="Room code" />
            <div class="row">
              <button class="btn primary" id="hostBtn">Create Room</button>
              <button class="btn" id="joinBtn">Join Code</button>
            </div>
          </section>
        </div>

        <section class="lobby-section">
          <h2>Fight AI</h2>
          <div class="row">
            <select id="pveLevelSelect" aria-label="PvE level">
              <option value="1">Level 1 - choose spell cards</option>

  <script src="assets/game-core.js"></script>
  <script>
    const lobby = document.getElementById("lobby");
    const game = document.getElementById("game");
    const roomInput = document.getElementById("roomInput");
    const playerNameInput = document.getElementById("playerNameInput");
    const practiceSpellSelect = document.getElementById("practiceSpellSelect");
    const pveLevelSelect = document.getElementById("pveLevelSelect");
    const hostBtn = document.getElementById("hostBtn");
    const joinBtn = document.getElementById("joinBtn");
    const practiceBtn = document.getElementById("practiceBtn");
    const pveBtn = document.getElementById("pveBtn");
    const leaveBtn = document.getElementById("leaveBtn");
    const deleteRoomBtn = document.getElementById("deleteRoomBtn");
    const clearBtn = document.getElementById("clearBtn");
    const roomList = document.getElementById("roomList");
    const lobbyCount = document.getElementById("lobbyCount");
    const duelLog = document.getElementById("duelLog");
    const matchLog = document.getElementById("matchLog");
    const roundLabel = document.getElementById("roundLabel");
    const timerText = document.getElementById("timerText");
    const timerFill = document.getElementById("timerFill");
    const roomBadge = document.getElementById("roomBadge");
    const roleBadge = document.getElementById("roleBadge");
    const youNameText = document.getElementById("youNameText");
    const rivalNameText = document.getElementById("rivalNameText");
    const youHpText = document.getElementById("youHpText");
    const rivalHpText = document.getElementById("rivalHpText");
    const youHpBar = document.getElementById("youHpBar");
    const rivalHpBar = document.getElementById("rivalHpBar");
    const seal = document.getElementById("seal");
    const battleReveal = document.getElementById("battleReveal");
    const pveChoicePanel = document.getElementById("pveChoicePanel");
    const pveSpellGrid = document.getElementById("pveSpellGrid");
    const youReveal = document.getElementById("youReveal");
    const rivalReveal = document.getElementById("rivalReveal");
    const youRevealImg = document.getElementById("youRevealImg");
    const rivalRevealImg = document.getElementById("rivalRevealImg");
    const youRevealName = document.getElementById("youRevealName");
    const rivalRevealName = document.getElementById("rivalRevealName");
    const youRevealSpell = document.getElementById("youRevealSpell");
    const rivalRevealSpell = document.getElementById("rivalRevealSpell");
    const pathLayer = document.getElementById("pathLayer");
    const patternText = document.getElementById("patternText");
    const resultText = document.getElementById("resultText");
    const spellCycle = document.querySelector(".spell-cycle");
    const spellList = document.querySelector(".spell-list");
    const guideRules = document.getElementById("guideRules");

    const positions = {
      1: [22, 22], 2: [50, 22], 3: [78, 22],
      4: [22, 50], 5: [50, 50], 6: [78, 50],
      7: [22, 78], 8: [50, 78], 9: [78, 78],
    };

    const GAME_CORE = window.GAME_CORE;
    const GAME_CONFIG = GAME_CORE.config || {};
    const STARTING_LIFE = Number(GAME_CONFIG.startingLife) || 10;
    const ROUND_SECONDS = Number(GAME_CONFIG.roundSeconds) || 5;
    const PENALTIES = GAME_CONFIG.penalties || { miscast: 1, timeout: 2 };
    const spells = (GAME_CORE.spells || []).map((spell) => ({
      ...spell,
      sequence: spell.pattern,
      edges: edgeBag(spell.pattern),
    }));
    const spellMap = Object.fromEntries(spells.map((spell) => [spell.name, spell]));
    const elementImages = Object.fromEntries(spells.map((spell) => [spell.name, spell.elementImage]));
    const BEATS = Object.fromEntries(
      Object.entries(GAME_CORE.matchups || {}).map(([spell, beaten]) => [spell, new Set(beaten)])
    );
    const failedSpellImage = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' fill='%23100f0d'/%3E%3Ccircle cx='60' cy='60' r='42' fill='none' stroke='%23ff3b4f' stroke-width='5' stroke-dasharray='10 8'/%3E%3Cpath d='M38 38l44 44M82 38L38 82' stroke='%23ffd166' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E";
    let sequence = [];
    let drawing = false;
    let livePoint = null;
    let lastHit = null;
    let lastColor = "#ff6a2a";
    let lastResult = null;
    let latestState = null;
    let latestStateReceivedAt = 0;
    let practiceMode = false;
    let practiceSpell = "Flame";
    let pveMode = false;
    let pveLevel = 1;
    let pveRound = 0;
    let pveTimer = null;
    let pveNextTimer = null;
    let pvePlayerLife = STARTING_LIFE;
    let pveAiLife = STARTING_LIFE;
    let pveSubmitted = false;
    let pveHistory = [];
    let pveDeadline = 0;
    let currentRoundId = 0;
    let submittedRoundId = 0;
    let attemptedRoundId = 0;
    let hadMiscastThisRound = false;
    let duel = {
      room: "",
      player: "",
      poll: null,
      lastEvent: 0,
      matchOver: false,
    };

    function edgeKey(a, b) {
      return a < b ? `${a}-${b}` : `${b}-${a}`;
    }

    function edgeBag(seq) {
      const bag = {};
      for (let i = 1; i < seq.length; i += 1) {
        const a = seq[i - 1];
        const b = seq[i];
        if (a === b) continue;
        const key = edgeKey(a, b);
        bag[key] = (bag[key] || 0) + 1;
      }
      return bag;
    }

    function bagEquals(source, target) {
      const keys = new Set([...Object.keys(source), ...Object.keys(target)]);
      for (const key of keys) {
        if ((source[key] || 0) !== (target[key] || 0)) return false;
      }
      return true;
    }

    function patternLabel(spell) {
      return (spell.pattern || spell.sequence || []).join("-");
    }

    function beatsLabel(spellName) {
      const beaten = GAME_CORE.matchups && GAME_CORE.matchups[spellName] ? GAME_CORE.matchups[spellName] : [];
      return beaten.length ? `beats ${beaten.join(", ")}` : "cancels only";
    }

    function hydrateCoreUi() {
      practiceSpellSelect.innerHTML = spells
        .map((spell) => `<option value="${spell.name}">${spell.name}</option>`)
        .join("");

      guideRules.innerHTML = [
        ["Wheel", "beats next 2"],
        [`${ROUND_SECONDS}s`, "round timer"],
        [`-${PENALTIES.timeout}`, "timeout loss"],
      ]
        .map(([title, text]) => `<div class="guide-rule"><b>${title}</b><span>${text}</span></div>`)
        .join("");

      spellCycle.querySelectorAll(".cycle-node").forEach((node) => node.remove());
      (GAME_CORE.wheel || spells.map((spell) => spell.name)).forEach((name) => {
        const spell = spellMap[name];
        if (!spell) return;
        const node = document.createElement("div");
        node.className = `cycle-node cycle-${name.toLowerCase()}`;
        node.innerHTML = `<img src="${spell.elementImage}" alt="${name}" /><b>${name}</b>`;
        spellCycle.appendChild(node);
      });

      spellList.innerHTML = spells
        .map((spell) => `<div class="spell"><img src="${spell.spellImage}" alt="${spell.name} spell pattern" /><div><b>${spell.name}</b><span>${patternLabel(spell)}</span><span class="spell-win">${beatsLabel(spell.name)}</span></div></div>`)
        .join("");

      timerText.textContent = `${ROUND_SECONDS.toFixed(1)}s`;
    }

    function scorePattern(seq) {
      const source = edgeBag(seq);
      const sourceEdges = Object.values(source).reduce((sum, value) => sum + value, 0);
      if (!sourceEdges) return null;

      const matches = [];
      for (const spell of spells) {
        if (bagEquals(source, spell.edges)) {
          matches.push({ spell });
        }
      }

      matches.sort((a, b) => {
        if (b.spell.level !== a.spell.level) return b.spell.level - a.spell.level;
        return b.spell.sequence.length - a.spell.sequence.length;
      });
      return matches[0] || null;
    }

    function makeDots() {
      Object.entries(positions).forEach(([id, pos]) => {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.dataset.id = id;
        dot.textContent = id;
        dot.style.left = `${pos[0]}%`;
        dot.style.top = `${pos[1]}%`;
        const dx = pos[0] - 50;
        const dy = pos[1] - 50;
        const distance = Math.hypot(dx, dy);
        dot.classList.add(distance < 5 ? "center-zone" : "ring-zone");
        seal.appendChild(dot);
      });
    }

    function api(path, payload) {
      const options = payload
        ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }
        : {};
      return fetch(path, options).then((response) => {
        if (!response.ok) throw new Error("Server unavailable");
        return response.json();
      });
    }

    function stopLocalTimers() {
      if (pveTimer) clearInterval(pveTimer);
      if (pveNextTimer) clearTimeout(pveNextTimer);
      pveTimer = null;
      pveNextTimer = null;
    }

    function showLobby(message) {
      lobby.classList.add("scene-on");
      game.classList.remove("scene-on");
      game.classList.remove("match-over");
      game.classList.remove("practice-on");
      game.classList.remove("pve-card-on");
      if (duel.poll) clearInterval(duel.poll);
      stopLocalTimers();
      duel.poll = null;
      practiceMode = false;
      pveMode = false;
      duel.room = "";
      duel.player = "";
      duel.lastEvent = 0;
      duel.matchOver = false;
      latestState = null;
      latestStateReceivedAt = 0;
      currentRoundId = 0;
      submittedRoundId = 0;
      attemptedRoundId = 0;
      hadMiscastThisRound = false;
      duelLog.textContent = message || "Ready.";
      showDrawPhase();
      clearPattern();
      refreshRooms();
    }

    function showGame() {
      lobby.classList.remove("scene-on");
      game.classList.add("scene-on");
    }

    function startPractice() {
      if (duel.poll) clearInterval(duel.poll);
      stopLocalTimers();
      duel.poll = null;
      practiceMode = true;
      pveMode = false;
      practiceSpell = practiceSpellSelect.value || "Flame";
      duel.room = "";
      duel.player = "practice";
      duel.lastEvent = 0;
      duel.matchOver = false;
      latestState = null;
      latestStateReceivedAt = 0;
      currentRoundId = 0;
      submittedRoundId = 0;
      attemptedRoundId = 0;
      hadMiscastThisRound = false;
      game.classList.remove("match-over");
      game.classList.remove("pve-card-on");
      game.classList.add("practice-on");
      roomBadge.textContent = "Practice";
      roleBadge.textContent = `${practiceSpell} drawing`;
      matchLog.textContent = `Practice ${practiceSpell}. Draw the approved pattern.`;
      patternText.textContent = "Pattern: none";
      resultText.textContent = "Draw when ready.";
      deleteRoomBtn.style.display = "none";
      showDrawPhase();
      clearPattern(false);
      showGame();
    }

    function pveLevelName() {
      if (pveLevel === 1) return "Level 1";
      if (pveLevel === 2) return "Level 2";
      return "Level 3";
    }

    function randomSpellName() {
      return spells[Math.floor(Math.random() * spells.length)].name;
    }

    function counterFor(spellName) {
      const counter = Object.entries(BEATS).find(([, beaten]) => beaten.has(spellName));
      return counter ? counter[0] : randomSpellName();
    }

    function chooseAiSpell() {
      if (pveLevel < 3 || !pveHistory.length) return randomSpellName();
      const counts = {};
      pveHistory.forEach((name) => {
        counts[name] = (counts[name] || 0) + 1;
      });
      const favorite = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
      return Math.random() < 0.62 ? counterFor(favorite) : randomSpellName();
    }

    function localRoundResult(playerSubmission, aiSubmission) {
      const s1 = playerSubmission.status;
      const s2 = aiSubmission.status;
      if (s1 !== "valid" && s2 !== "valid") return { loser: "", penalty: 0, message: "Both failed. Draw." };
      if (s1 === "valid" && s2 !== "valid") {
        const penalty = s2 === "timeout" ? PENALTIES.timeout : PENALTIES.miscast;
        return { loser: "ai", penalty, message: `${playerSubmission.spell} wins. AI loses ${penalty} life.` };
      }
      if (s2 === "valid" && s1 !== "valid") {
        const penalty = s1 === "timeout" ? PENALTIES.timeout : PENALTIES.miscast;
        return { loser: "player", penalty, message: `${aiSubmission.spell} wins. Player 1 loses ${penalty} life.` };
      }
      if (playerSubmission.spell === aiSubmission.spell) return { loser: "", penalty: 0, message: `Both cast ${playerSubmission.spell}. Draw.` };
      if (BEATS[playerSubmission.spell] && BEATS[playerSubmission.spell].has(aiSubmission.spell)) return { loser: "ai", penalty: 1, message: `${playerSubmission.spell} beats ${aiSubmission.spell}. AI loses 1 life.` };
      if (BEATS[aiSubmission.spell] && BEATS[aiSubmission.spell].has(playerSubmission.spell)) return { loser: "player", penalty: 1, message: `${aiSubmission.spell} beats ${playerSubmission.spell}. Player 1 loses 1 life.` };
      return { loser: "", penalty: 0, message: `${playerSubmission.spell} and ${aiSubmission.spell} cancel. Draw.` };
    }

    function buildPveSpellButtons() {
      pveSpellGrid.innerHTML = "";
      spells.forEach((spell) => {
        const button = document.createElement("button");
        button.className = "pve-spell-btn";
        button.type = "button";
        button.innerHTML = `<img src="${elementImages[spell.name]}" alt="${spell.name}" /><b>${spell.name}</b>`;
        button.addEventListener("click", () => submitPveSpell(spell.name));
        pveSpellGrid.appendChild(button);
      });
    }

    function setPveButtonsDisabled(disabled) {
      pveSpellGrid.querySelectorAll("button").forEach((button) => {
        button.disabled = disabled;
      });
    }

    function startPve() {
      if (duel.poll) clearInterval(duel.poll);
      stopLocalTimers();
      duel.poll = null;
      practiceMode = false;
      pveMode = true;
      pveLevel = Number(pveLevelSelect.value) || 1;
      pveRound = 0;
      pvePlayerLife = STARTING_LIFE;
      pveAiLife = STARTING_LIFE;
      pveHistory = [];
      duel.room = "";
      duel.player = "p1";
      duel.lastEvent = 0;
      duel.matchOver = false;
      latestState = null;
      latestStateReceivedAt = 0;
      currentRoundId = 0;
      submittedRoundId = 0;
      attemptedRoundId = 0;
      hadMiscastThisRound = false;
      game.classList.remove("match-over", "practice-on");
      roomBadge.textContent = "PvE";
      roleBadge.textContent = `${pveLevelName()} vs AI`;
      deleteRoomBtn.style.display = "none";
      youNameText.textContent = playerName();
      rivalNameText.textContent = "AI Mage";
      setLife(youHpText, youHpBar, pvePlayerLife);
      setLife(rivalHpText, rivalHpBar, pveAiLife);
      buildPveSpellButtons();
      showGame();
      startPveRound();
    }

    function startPveRound() {
      if (!pveMode || duel.matchOver) return;
      stopLocalTimers();
      pveRound += 1;
      pveSubmitted = false;
      pveDeadline = Date.now() / 1000 + ROUND_SECONDS;
      currentRoundId = pveRound;
      submittedRoundId = 0;
      attemptedRoundId = 0;
      hadMiscastThisRound = false;
      showDrawPhase();
      clearPattern(false);
      resultText.textContent = pveLevel === 1 ? "Choose a spell." : `Round ${pveRound}.`;
      matchLog.textContent = pveLevel === 1 ? "Choose one spell before time ends." : "Draw one spell before time ends.";
      roundLabel.textContent = `Round ${pveRound}`;
      timerText.textContent = `${ROUND_SECONDS.toFixed(1)}s`;
      timerFill.style.width = "100%";
      if (pveLevel === 1) {
        game.classList.add("pve-card-on");
        pveChoicePanel.classList.add("phase-on");
        setPveButtonsDisabled(false);
      } else {
        game.classList.remove("pve-card-on");
        pveChoicePanel.classList.remove("phase-on");
      }
      pveTimer = setInterval(updatePveTimer, 100);
    }

    function updatePveTimer() {
      if (!pveMode || duel.matchOver) return;
      const left = Math.max(0, pveDeadline - Date.now() / 1000);
      timerText.textContent = `${left.toFixed(1)}s`;
      timerFill.style.width = `${Math.max(0, Math.min(100, (left / ROUND_SECONDS) * 100))}%`;
      if (!pveSubmitted) {
        matchLog.textContent = `${pveLevelName()} - ${left.toFixed(1)}s. ${pveLevel === 1 ? "Choose now." : "Draw now."}`;
      }
      if (left <= 0 && !pveSubmitted) {
        submitPveResult({ status: "timeout", spell: "" });
      }
    }

    function submitPveSpell(spellName) {
      if (!pveMode || pveSubmitted || duel.matchOver || pveLevel !== 1) return;
      submitPveResult({ status: "valid", spell: spellName });
    }

    function submitPveResult(playerSubmission) {
      if (!pveMode || pveSubmitted || duel.matchOver) return;
      pveSubmitted = true;
      if (pveTimer) clearInterval(pveTimer);
      pveTimer = null;
      setPveButtonsDisabled(true);
      const aiSubmission = { status: "valid", spell: chooseAiSpell() };
      if (playerSubmission.status === "valid") pveHistory.push(playerSubmission.spell);
      const result = localRoundResult(playerSubmission, aiSubmission);
      if (result.loser === "player") pvePlayerLife = Math.max(0, pvePlayerLife - result.penalty);
      if (result.loser === "ai") pveAiLife = Math.max(0, pveAiLife - result.penalty);
      setLife(youHpText, youHpBar, pvePlayerLife);
      setLife(rivalHpText, rivalHpBar, pveAiLife);
      latestState = {
        you: { name: playerName(), life: pvePlayerLife },
        rival: { name: "AI Mage", life: pveAiLife },
      };
      const event = {
        round: pveRound,
        message: result.message,
        p1: playerSubmission,
        p2: aiSubmission,
      };
      resultText.textContent = `Round ${pveRound}: ${result.message}`;
      revealOutcome(event);
      if (pvePlayerLife <= 0 || pveAiLife <= 0) {
        duel.matchOver = true;
        game.classList.add("match-over");
        matchLog.textContent = pveAiLife <= 0 ? "Victory over AI." : "Defeat by AI.";
        resultText.textContent = pveAiLife <= 0 ? "Victory." : "Defeat.";
        return;
      }
      matchLog.textContent = "Next PvE round soon.";
      pveNextTimer = setTimeout(startPveRound, 2600);
    }

    function roomCode() {
      return (roomInput.value || "ARCANE").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || "ARCANE";
    }

    function playerName() {
      const name = (playerNameInput.value || "Mage").trim().slice(0, 18) || "Mage";
      localStorage.setItem("arcanePlayerName", name);
      return name;
    }

    function randomRoomCode() {
      return "ROOM" + Math.floor(1000 + Math.random() * 9000);
    }

    function createdRooms() {
      try {
        return JSON.parse(localStorage.getItem("arcaneCreatedRooms") || "[]");
      } catch (error) {
        return [];
      }
    }

    function saveCreatedRoom(code) {
      const rooms = new Set(createdRooms());
      rooms.add(code);
      localStorage.setItem("arcaneCreatedRooms", JSON.stringify([...rooms]));
    }

    function forgetCreatedRoom(code) {
      localStorage.setItem("arcaneCreatedRooms", JSON.stringify(createdRooms().filter((room) => room !== code)));
    }

    function renderRooms(data) {
      if (!roomList) return;
      lobbyCount.textContent = `Open rooms: ${(data.rooms || []).filter((room) => room.open).length} - Online: ${data.serverUsers || 0}`;
      if (!data.rooms || !data.rooms.length) {
        roomList.innerHTML = `<div class="note">No rooms yet. Create one.</div>`;
        return;
      }
      roomList.innerHTML = "";
      const owned = new Set(createdRooms());
      data.rooms.forEach((room) => {
        const item = document.createElement("div");
        item.className = "room-card";
        const canDelete = owned.has(room.code) || room.users === 0;
        item.innerHTML = `
          <div><b>Room ${room.code}</b><span>${room.users}/2 players · Host: ${room.host || "Player 1"} · ${room.open ? "Open" : "Full"}</span></div>
          <div class="room-actions">
            <button class="btn" type="button" ${room.open ? "" : "disabled"}>Join</button>
            ${canDelete ? '<button class="btn" type="button" data-delete="1">Delete</button>' : ""}
          </div>`;
        item.querySelector(".room-actions .btn").addEventListener("click", () => {
          roomInput.value = room.code;
          connectDuel("join");
        });
        const deleteBtn = item.querySelector("[data-delete]");
        if (deleteBtn) {
          deleteBtn.addEventListener("click", () => deleteCreatedRoom(room.code, true));
        }
        roomList.appendChild(item);
      });
    }

    async function refreshRooms() {
      if (!lobby.classList.contains("scene-on")) return;
      try {
        renderRooms(await api("/api/rooms"));
      } catch (error) {
        lobbyCount.textContent = "Online server not running. Try again after the host wakes up.";
      }
    }

    async function deleteCreatedRoom(code, stayLobby = false) {
      try {
        await api("/api/delete_room", { room: code, player: "p1" });
        forgetCreatedRoom(code);
        if (duel.room === code) {
          showLobby("Room deleted.");
        } else if (stayLobby) {
          duelLog.textContent = "Room deleted.";
          refreshRooms();
        }
      } catch (error) {
        duelLog.textContent = "Only the room creator can delete this room.";
        matchLog.textContent = "Only the room creator can delete this room.";
      }
    }

    function setLife(elText, elBar, value) {
      const life = Math.max(0, Math.min(STARTING_LIFE, Number(value) || 0));
      elText.textContent = `${life}`;
      elBar.style.width = `${(life / STARTING_LIFE) * 100}%`;
    }

    function roundRemaining() {
      if (!latestState || !latestState.round) return 0;
      const elapsed = Date.now() / 1000 - latestStateReceivedAt;
      return Math.max(0, latestState.round.remaining - elapsed);
    }

    function canDraw() {
      if (practiceMode) return true;
      if (pveMode) return pveLevel > 1 && !pveSubmitted && !duel.matchOver && Date.now() / 1000 < pveDeadline;
      return Boolean(
        duel.room &&
        !duel.matchOver &&
        latestState &&
        latestState.round &&
        !latestState.round.youSubmitted &&
        submittedRoundId !== latestState.round.id &&
        roundRemaining() > 0
      );
    }

    function updateTimerText() {
      if (!latestState || duel.matchOver) return;
      if ((latestState.roomUsers || 0) < 2) {
        matchLog.textContent = `Room ${latestState.room} ready. Waiting for rival.`;
        roundLabel.textContent = "Waiting";
        timerText.textContent = `${ROUND_SECONDS.toFixed(1)}s`;
        timerFill.style.width = "0%";
        return;
      }
      if (!latestState.round) {
        roundLabel.textContent = "Next round";
        const wait = latestState.nextRoundAt ? Math.max(0, latestState.nextRoundAt - Date.now() / 1000) : 0;
        timerText.textContent = wait > 0 ? `${wait.toFixed(1)}s` : "soon";
        timerFill.style.width = wait > 0 ? `${Math.max(0, Math.min(100, (wait / 2.5) * 100))}%` : "0%";
        matchLog.textContent = wait > 0 ? `Next round in ${wait.toFixed(1)}s.` : "Starting next round...";
        return;
      }
      const left = roundRemaining();
      const total = latestState.rules ? latestState.rules.roundSeconds : ROUND_SECONDS;
      const percent = Math.max(0, Math.min(100, (left / total) * 100));
      const submitText = latestState.round.youSubmitted || submittedRoundId === latestState.round.id ? "Spell locked." : "Draw now.";
      roundLabel.textContent = `Round ${latestState.round.id}`;
      timerText.textContent = `${left.toFixed(1)}s`;
      timerFill.style.width = `${percent}%`;
      matchLog.textContent = `Round ${latestState.round.id} - ${left.toFixed(1)}s. ${submitText}`;
      const hasCurrentRoundEvent = latestState.events.some((event) => event.round === latestState.round.id);
      if (left <= 0 && !hasCurrentRoundEvent) {
        showResolvingPhase();
      }
    }

    function showDrawPhase() {
      seal.classList.remove("phase-hidden");
      battleReveal.classList.remove("phase-on");
      if (!pveMode || pveLevel > 1) pveChoicePanel.classList.remove("phase-on");
    }

    function showRevealPhase() {
      battleReveal.classList.remove("phase-on");
      void battleReveal.offsetWidth;
      seal.classList.add("phase-hidden");
      battleReveal.classList.add("phase-on");
    }

    function showResolvingPhase() {
      setRevealSide(youReveal, youRevealImg, youRevealSpell, youRevealName, latestState.you.name || "You", { status: "waiting", spell: "" }, "draw");
      setRevealSide(rivalReveal, rivalRevealImg, rivalRevealSpell, rivalRevealName, latestState.rival.name || "Rival", { status: "waiting", spell: "" }, "draw");
      youRevealSpell.textContent = "Resolving";
      rivalRevealSpell.textContent = "Resolving";
      showRevealPhase();
    }

    function statusLabel(submission) {
      if (!submission) return "Timeout";
      if (submission.status === "valid") return submission.spell;
      if (submission.status === "miscast") return "Miscast";
      if (submission.status === "timeout") return "Timeout";
      if (submission.status === "waiting") return "Resolving";
      return "Failed";
    }

    function setRevealSide(root, img, spellText, nameText, name, submission, stateClass) {
      root.classList.remove("win", "lose", "draw");
      void root.offsetWidth;
      root.classList.add(stateClass);
      nameText.textContent = name;
      spellText.textContent = statusLabel(submission);
      const spell = submission && submission.status === "valid" ? submission.spell : "";
      if (spell && elementImages[spell]) {
        img.src = elementImages[spell];
        img.alt = `${spell} spell`;
      } else {
        img.src = failedSpellImage;
        img.alt = statusLabel(submission);
      }
    }

    function revealOutcome(event) {
      const youSubmission = duel.player === "p1" ? event.p1 : event.p2;
      const rivalSubmission = duel.player === "p1" ? event.p2 : event.p1;
      const youLost = event.message.includes(duel.player === "p1" ? "Player 1 loses" : "Player 2 loses") || event.message.includes("You lose");
      const rivalLost = event.message.includes(duel.player === "p1" ? "Player 2 loses" : "Player 1 loses") || event.message.includes("AI loses");
      const youState = youLost ? "lose" : rivalLost ? "win" : "draw";
      const rivalState = rivalLost ? "lose" : youLost ? "win" : "draw";
      setRevealSide(youReveal, youRevealImg, youRevealSpell, youRevealName, latestState.you.name || "You", youSubmission, youState);
      setRevealSide(rivalReveal, rivalRevealImg, rivalRevealSpell, rivalRevealName, latestState.rival.name || "Rival", rivalSubmission, rivalState);
      showRevealPhase();
    }

    function updateState(state) {
      latestState = state;
      latestStateReceivedAt = Date.now() / 1000;
      setLife(youHpText, youHpBar, state.you.life);
      setLife(rivalHpText, rivalHpBar, state.rival.life);
      youNameText.textContent = state.you.name || "You";
      rivalNameText.textContent = state.rival.name || "Rival";
      lobbyCount.textContent = `Players: ${state.roomUsers || 0}/2 in room - Online: ${state.serverUsers || 0}`;
      if (state.winner) {
        duel.matchOver = true;
        game.classList.add("match-over");
        if (duel.poll) clearInterval(duel.poll);
        duel.poll = null;
        const won = state.winner === duel.player;
        resultText.textContent = won ? "Victory." : "Defeat.";
        matchLog.textContent = won ? "Match won." : "Match lost.";
        return;
      }

      if (state.events.length && state.events[state.events.length - 1].id !== duel.lastEvent) {
        const event = state.events[state.events.length - 1];
        duel.lastEvent = event.id;
        resultText.textContent = `Round ${event.round}: ${event.message}`;
        revealOutcome(event);
      }

      if (state.round && state.round.id !== currentRoundId) {
        currentRoundId = state.round.id;
        submittedRoundId = 0;
        attemptedRoundId = 0;
        hadMiscastThisRound = false;
        showDrawPhase();
        clearPattern();
        resultText.textContent = `Round ${state.round.id}.`;
      }
      updateTimerText();
    }

    async function connectDuel(role) {
      try {
        duelLog.textContent = "Contacting online server...";
        const joined = await api("/api/join", { room: roomCode(), role, name: playerName(), reset: role === "host" });
        duel.room = joined.room;
        duel.player = joined.player;
        duel.lastEvent = 0;
        duel.matchOver = false;
        roomBadge.textContent = duel.room;
        roleBadge.textContent = `${joined.you.name || playerName()} · ${duel.player === "p1" ? "Player 1" : "Player 2"}`;
        practiceMode = false;
        pveMode = false;
        stopLocalTimers();
        game.classList.remove("practice-on");
        game.classList.remove("pve-card-on");
        pveChoicePanel.classList.remove("phase-on");
        deleteRoomBtn.style.display = duel.player === "p1" ? "" : "none";
        if (role === "host" && duel.player === "p1") saveCreatedRoom(joined.room);
        showGame();
        updateState(joined);
        if (duel.poll) clearInterval(duel.poll);
        duel.poll = setInterval(pollDuel, 500);
      } catch (error) {
        duelLog.textContent = "Online server not running. Try again after the host wakes up.";
        lobbyCount.textContent = "Players: 0/2 in room - Online: 0";
      }
    }

    async function pollDuel() {
      if (!duel.room || !duel.player) return;
      try {
        const state = await api(`/api/state?room=${encodeURIComponent(duel.room)}&player=${encodeURIComponent(duel.player)}`);
        updateState(state);
      } catch (error) {
        matchLog.textContent = "Online server not running. Try again after the host wakes up.";
      }
    }

    async function submitRound(status, spell = "") {
      if (!duel.room || !duel.player || duel.matchOver) return;
      if (!latestState || !latestState.round || submittedRoundId === latestState.round.id) return;
      submittedRoundId = latestState.round.id;
      try {
        const state = await api("/api/submit", {
          room: duel.room,
          player: duel.player,
          status,
          spell,
        });
        updateState(state);
      } catch (error) {
        matchLog.textContent = "Submission stayed local. Online server not running.";
      }
    }

    async function markAttemptedMiscast() {
      if (!latestState || !latestState.round || attemptedRoundId === latestState.round.id) return;
      attemptedRoundId = latestState.round.id;
      try {
        await api("/api/submit", {
          room: duel.room,
          player: duel.player,
          status: "attempted",
        });
      } catch (error) {
        matchLog.textContent = "Attempt stayed local. Online server not running.";
      }
    }

    function nearestDot(clientX, clientY) {
      const rect = seal.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * 100;
      const y = ((clientY - rect.top) / rect.height) * 100;
      livePoint = [x, y];
      let closest = null;
      let closestDistance = Infinity;
      for (const [id, pos] of Object.entries(positions)) {
        const dx = x - pos[0];
        const dy = y - pos[1];
        const distance = Math.hypot(dx, dy);
        if (distance < closestDistance) {
          closest = Number(id);
          closestDistance = distance;
        }
      }
      return closestDistance <= 9 ? closest : null;
    }

    function markDot(id) {
      const dot = seal.querySelector(`.dot[data-id="${id}"]`);
      if (dot) dot.classList.add("hit");
    }

    function appendDot(id) {
      if (!id || id === lastHit) return;
      sequence.push(id);
      lastHit = id;
      markDot(id);
      renderPath();
    }

    function line(from, to, className, color) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
      el.setAttribute("x1", from[0]);
      el.setAttribute("y1", from[1]);
      el.setAttribute("x2", to[0]);
      el.setAttribute("y2", to[1]);
      el.setAttribute("class", className);
      el.style.stroke = color;
      return el;
    }

    function renderPath(stateClass = "") {
      pathLayer.innerHTML = "";
      const color = lastResult ? lastResult.spell.color : lastColor;
      for (let i = 1; i < sequence.length; i += 1) {
        const from = positions[sequence[i - 1]];
        const to = positions[sequence[i]];
        if (from && to) pathLayer.appendChild(line(from, to, `draw-line ${stateClass}`, color));
      }
      if (drawing && sequence.length && livePoint) {
        const from = positions[sequence[sequence.length - 1]];
        pathLayer.appendChild(line(from, livePoint, "draw-line live", color));
      }
      patternText.textContent = `Pattern: ${sequence.length ? sequence.join("-") : "none"}`;
    }

    function clearPattern(resetMessage = true) {
      sequence = [];
      drawing = false;
      livePoint = null;
      lastHit = null;
      lastResult = null;
      pathLayer.innerHTML = "";
      seal.querySelectorAll(".dot").forEach((dot) => dot.classList.remove("hit"));
      patternText.textContent = "Pattern: none";
      if (resetMessage) {
        resultText.textContent = practiceMode ? "Draw when ready." : duel.matchOver ? resultText.textContent : "Ready.";
      }
    }

    function finishPattern() {
      if (!drawing || duel.matchOver) return;
      drawing = false;
      livePoint = null;
      lastHit = null;
      if (practiceMode) {
        const match = scorePattern(sequence);
        if (match && match.spell.name === practiceSpell) {
          lastResult = match;
          lastColor = match.spell.color;
          resultText.textContent = `${practiceSpell} success.`;
          matchLog.textContent = `Correct ${practiceSpell}. Draw again to practice more.`;
          renderPath("success");
        } else if (match) {
          lastResult = match;
          lastColor = match.spell.color;
          resultText.textContent = `${match.spell.name} drawn, target is ${practiceSpell}.`;
          matchLog.textContent = `Good shape, wrong spell. Target: ${practiceSpell}.`;
          renderPath("fail");
        } else if (sequence.length > 1) {
          resultText.textContent = "Miscast. Try again.";
          matchLog.textContent = `Practice ${practiceSpell}. Try the pattern again.`;
          renderPath("fail");
          setTimeout(() => {
            if (!drawing && practiceMode) clearPattern(false);
          }, 520);
        } else {
          clearPattern();
        }
        return;
      }
      if (pveMode) {
        if (!canDraw()) {
          resultText.textContent = "Too late.";
          renderPath("fail");
          return;
        }
        const match = scorePattern(sequence);
        if (match) {
          lastResult = match;
          lastColor = match.spell.color;
          resultText.textContent = `${match.spell.name} locked.`;
          renderPath("success");
          submitPveResult({ status: "valid", spell: match.spell.name });
        } else if (sequence.length > 1) {
          resultText.textContent = "Miscast. Try again.";
          renderPath("fail");
          setTimeout(() => {
            if (!drawing && canDraw() && pveMode) clearPattern(false);
          }, 420);
        } else {
          clearPattern();
        }
        return;
      }
      if (!canDraw()) {
        resultText.textContent = "Too late.";
        renderPath("fail");
        return;
      }
      const match = scorePattern(sequence);
      if (match) {
        lastResult = match;
        lastColor = match.spell.color;
        resultText.textContent = `${match.spell.name} locked.`;
        renderPath("success");
        submitRound("valid", match.spell.name);
      } else if (sequence.length > 1) {
        hadMiscastThisRound = true;
        resultText.textContent = "Miscast. Try again.";
        renderPath("fail");
        markAttemptedMiscast();
        setTimeout(() => {
          if (!drawing && canDraw() && hadMiscastThisRound) clearPattern(false);
        }, 420);
      } else {
        clearPattern();
      }
    }

    seal.addEventListener("pointerdown", (event) => {
      if (!canDraw()) return;
      event.preventDefault();
      clearPattern();
      drawing = true;
      seal.setPointerCapture(event.pointerId);
      appendDot(nearestDot(event.clientX, event.clientY));
      renderPath();
    });

    seal.addEventListener("pointermove", (event) => {
      if (!drawing || duel.matchOver) return;
      event.preventDefault();
      appendDot(nearestDot(event.clientX, event.clientY));
      renderPath();
    });

    seal.addEventListener("pointerup", finishPattern);
    seal.addEventListener("pointercancel", finishPattern);
    clearBtn.addEventListener("click", clearPattern);
    hostBtn.addEventListener("click", () => connectDuel("host"));
    joinBtn.addEventListener("click", () => connectDuel("join"));
    practiceBtn.addEventListener("click", startPractice);
    pveBtn.addEventListener("click", startPve);
    leaveBtn.addEventListener("click", () => showLobby("Choose a room for the next duel."));
    deleteRoomBtn.addEventListener("click", () => deleteCreatedRoom(duel.room));
    setInterval(updateTimerText, 100);
    setInterval(refreshRooms, 1800);
    hostBtn.addEventListener("click", () => {
      roomInput.value = randomRoomCode();
    }, { capture: true });
    playerNameInput.value = localStorage.getItem("arcanePlayerName") || "Mage";
    playerNameInput.addEventListener("input", playerName);
    hydrateCoreUi();
    refreshRooms();

    makeDots();
    clearPattern();
  </script>
</body>
</html>
